name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit tests
        run: pytest -q
      - name: Run every example
        run: |
          for f in examples/ch*.py; do
            echo "== $f"; python "$f" > /dev/null
          done
      - name: Release eval gate
        run: evalloop gate
      - name: Release review
        run: evalloop review
